[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myvsb-developer-api"
version = "1.0.5"
authors = [
  { name="net0045", email="stepan.netolicky@vsb.cz" },
]
description = "Asynchronous Python library for the MyVSB Developer API"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
]

[project.urls]
"Homepage" = "https://github.com/mobility-lab-vsb/myvsb-developer-api"
"Bug Tracker" = "https://github.com/mobility-lab-vsb/myvsb-developer-api/issues"

[tool.pytest.ini_options]
pythonpath = ["src/myskoda_openapi"]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "aresponses>=3.0.0",
]
