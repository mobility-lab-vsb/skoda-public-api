name: Run Tests

on:
  push:
    branches: [ main, net0045 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"] 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: dev/myskoda-developer-api/pyproject.toml

    - name: Install dependencies
      working-directory: dev/myskoda-developer-api
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio aresponses
        pip install -e .

    - name: Run pytest
      working-directory: dev/myskoda-developer-api/src
      run: |
        pytest tests/ci_cd_tests/